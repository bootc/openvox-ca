{{- if and .Values.kubernetesExport.enabled .Values.kubernetesExport.rbac.create }}
{{- $fullName := include "openvox-ca.fullname" . }}
{{- $namespace := include "openvox-ca.namespace" . }}
{{- $labels := include "openvox-ca.labels" . }}
{{- $serviceAccount := include "openvox-ca.serviceAccountName" . }}
{{- $cluster := eq .Values.kubernetesExport.rbac.scope "ClusterRole" }}
{{/*
The exporter only ever creates or server-side-applies its targets — it never
reads them back — so create and patch are the whole permission set.
*/}}
{{- if $cluster }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $fullName }}-export
  labels:
    {{- $labels | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
rules:
{{- $names := include "openvox-ca.exportTargetNames" $ | fromJsonArray }}
  # create cannot be restricted by resourceNames — the object has no name yet
  # at admission time — but patch can, so overwriting an existing Secret is
  # limited to the objects actually configured as export targets. The names are
  # taken from the merged config, so targets set through config.kubernetes_export
  # are covered too; an externally managed ConfigMap leaves the list empty,
  # since the chart cannot see what it asks for.
  - apiGroups: [""]
    resources: ["secrets", "configmaps"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets", "configmaps"]
    verbs: ["patch"]
    {{- with $names }}
    resourceNames:
      {{- toYaml . | nindent 6 }}
    {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $fullName }}-export
  labels:
    {{- $labels | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $fullName }}-export
subjects:
  - kind: ServiceAccount
    name: {{ $serviceAccount }}
    namespace: {{ $namespace }}
{{- else }}
{{/*
One Role/RoleBinding pair per namespace exported into: the release namespace,
plus whatever rbac.namespaces lists.
*/}}
{{- range $ns := prepend .Values.kubernetesExport.rbac.namespaces $namespace | uniq }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $fullName }}-export
  namespace: {{ $ns }}
  labels:
    {{- $labels | nindent 4 }}
  {{- with $.Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
rules:
{{- $names := include "openvox-ca.exportTargetNames" $ | fromJsonArray }}
  # create cannot be restricted by resourceNames — the object has no name yet
  # at admission time — but patch can, so overwriting an existing Secret is
  # limited to the objects actually configured as export targets. The names are
  # taken from the merged config, so targets set through config.kubernetes_export
  # are covered too; an externally managed ConfigMap leaves the list empty,
  # since the chart cannot see what it asks for.
  - apiGroups: [""]
    resources: ["secrets", "configmaps"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets", "configmaps"]
    verbs: ["patch"]
    {{- with $names }}
    resourceNames:
      {{- toYaml . | nindent 6 }}
    {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $fullName }}-export
  namespace: {{ $ns }}
  labels:
    {{- $labels | nindent 4 }}
  {{- with $.Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $fullName }}-export
subjects:
  - kind: ServiceAccount
    name: {{ $serviceAccount }}
    namespace: {{ $namespace }}
{{- end }}
{{- end }}
{{- end }}
